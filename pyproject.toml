[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rhythm"
version = "0.1.0"
description = "Rhythm, cadence, and tempo analysis for agent behavioral patterns"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
